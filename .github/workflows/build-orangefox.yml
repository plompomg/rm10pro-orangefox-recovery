name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      SYNC_BRANCH:
        description: OrangeFox branch to sync
        required: true
        default: "14.1"
        type: string
      BUILD_TYPE:
        description: Build type
        required: true
        default: eng
        type: choice
        options:
          - eng
          - userdebug
      RELEASE_BUILD:
        description: Create a GitHub release
        required: false
        default: false
        type: boolean

# Needed so the release step is allowed to create a release/tag.
permissions:
  contents: write

jobs:
  build:
    name: Build OrangeFox for NX789J
    runs-on: ubuntu-22.04
    env:
      FOX_DIR: /home/runner/fox_${{ inputs.SYNC_BRANCH }}
      CCACHE_DIR: /home/runner/ccache
    defaults:
      run:
        # explicit bash enables pipefail, so a failed make | tee fails the step
        shell: bash
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget python3 python-is-python3 \
            bc bison build-essential ccache flex \
            g++-multilib gcc-multilib gnupg gperf \
            imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev lz4 libncurses-dev libsdl1.2-dev \
            libssl-dev libwxgtk3.0-gtk3-dev libxml2-dev \
            libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk

      - name: Set up git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # Restore first, then configure, so the size limit applies to the restored cache.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/ccache
          key: ccache-orangefox-${{ inputs.SYNC_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-orangefox-${{ inputs.SYNC_BRANCH }}-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
          # GitHub allows 10 GB of cache per repo in total, so keep this well under it
          ccache -M 5G

      - name: Sync OrangeFox source
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          ./orangefox_sync.sh --branch ${{ inputs.SYNC_BRANCH }} --path "$FOX_DIR" -j$(nproc) --shallow-clone

      - name: Place device tree
        run: |
          mkdir -p "$FOX_DIR/device/nubia"
          git clone --depth 1 https://github.com/plompomg/rm10pro-orangefox-recovery "$FOX_DIR/device/nubia/NX789J"
          # Windows download markers break the build (colon in filename), so remove any that got committed
          find "$FOX_DIR/device/nubia/NX789J" -name '*:Zone.Identifier' -print -delete

      - name: Build OrangeFox
        run: |
          cd "$FOX_DIR"
          source build/envsetup.sh
          lunch orangefox_NX789J-ap2a-${{ inputs.BUILD_TYPE }}
          make -j$(nproc) adbd recoveryimage 2>&1 | tee build.log

      # Save the cache even when the build fails, so the next run isn't starting cold.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/ccache
          key: ccache-orangefox-${{ inputs.SYNC_BRANCH }}-${{ github.run_id }}

      - name: Check build output
        run: |
          IMG="$FOX_DIR/out/target/product/NX789J/recovery.img"
          if [ ! -f "$IMG" ]; then
            echo "Build failed - recovery.img not found"
            exit 1
          fi
          echo "Build successful!"
          ls -lh "$IMG"

      - name: Rename output
        run: |
          DATE=$(date +%Y%m%d)
          NAME="OrangeFox-${{ inputs.SYNC_BRANCH }}-NX789J-$DATE.img"
          cp "$FOX_DIR/out/target/product/NX789J/recovery.img" "$HOME/$NAME"
          echo "BUILD_DATE=$DATE" >> $GITHUB_ENV
          echo "IMG_PATH=$HOME/$NAME" >> $GITHUB_ENV
          echo "IMG_NAME=$NAME" >> $GITHUB_ENV

      - name: Upload recovery image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMG_NAME }}
          path: ${{ env.IMG_PATH }}
          retention-days: 7

      - name: Upload build log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.FOX_DIR }}/build.log
          retention-days: 7
          if-no-files-found: ignore

      # RELEASE_BUILD is a real boolean, so don't compare it to the string 'true'
      # (that comparison is always false, which is why this step was being skipped).
      - name: Create GitHub release
        if: ${{ inputs.RELEASE_BUILD }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OFR-${{ inputs.SYNC_BRANCH }}-${{ github.run_number }}
          name: OrangeFox ${{ inputs.SYNC_BRANCH }} — NX789J Build ${{ github.run_number }}
          body: |
            ## OrangeFox Recovery for Nubia RedMagic 10 Pro (NX789J)

            **Branch:** ${{ inputs.SYNC_BRANCH }}
            **Build type:** ${{ inputs.BUILD_TYPE }}
            **Date:** ${{ env.BUILD_DATE }}

            ### Testing
            Boot the image once before flashing anything permanently, and keep fastboot access available.

            ### Status
            - ✅ OrangeFox UI
            - ✅ Touch
            - ✅ ADB
            - ✅ Decryption (FBE)
            - ✅ Flashing ZIPs
          files: ${{ env.IMG_PATH }}
          draft: false
          prerelease: ${{ inputs.BUILD_TYPE != 'userdebug' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
